; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ----------------------------------------------------------------------------
; Migrado a arduino-esp32 3.x (ESP-IDF 5.x) vía la plataforma pioarduino.
; Motivo: el mbedTLS de arduino-esp32 2.0.x no valida SANs tipo IP, lo que rompía
; el MQTT sobre TLS contra el broker (cert con SAN IP-only). mbedTLS 3.x (IDF5) sí.
; Se eliminó todo lo de LoRa/Heltec (libheltec precompilado, libs Heltec, LoraWan,
; DISPLAY) porque no se usa, y WebSerial (WebSerialLite no es compatible con IDF5).
; ----------------------------------------------------------------------------

[platformio]
; `pio run` solo construye el firmware. El env `native` es solo-para-tests
; (su main() vive en test/), así que sin esto `pio run` lo intentaría enlazar
; sin main() y fallaría. Los tests se corren aparte con:  pio test -e native
default_envs = heltec_wifi_lora_32_V3

[env:heltec_wifi_lora_32_V3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = heltec_wifi_lora_32_V3
framework = arduino
; (WIFI_LoRa_32_V3 ya lo define el variant heltec_wifi_lora_32_V3 del core)
build_flags =
	; OneWire 2.3.8 accede directo a registros GPIO pero en IDF5 ya no llega el
	; header que declara el símbolo 'GPIO'. Lo forzamos para todo el build.
	-include "soc/gpio_struct.h"
; Puertos sin fijar: PlatformIO autodetecta. Hardcodearlos rompe el build en
; Windows (COMx) y en cualquier Mac con otro adaptador. Descomentar solo si la
; autodetección falla.
;upload_port = /dev/cu.SLAB_USBtoUART
;monitor_port = /dev/cu.usbmodem101
monitor_speed = 115200
lib_ldf_mode = deep
monitor_filters = esp32_exception_decoder
; test_configstore es un test NATIVO (corre con -e native, usa mocks de PC).
; Ignorarlo aquí para que `pio test` a secas no intente compilarlo contra el
; firmware del ESP32 (fallaría por falta de los mocks/-I y necesitaría la placa).
test_ignore = test_configstore
lib_deps =
	milesburton/DallasTemperature@^3.11.0
	paulstoffregen/OneWire@^2.3.8
	adafruit/RTClib@^2.1.1
	br3ttb/PID@^1.2.1
	knolleary/PubSubClient@^2.8
	arduino-libraries/NTPClient@^3.2.1
	bblanchon/ArduinoJson@^6.21.3
	https://github.com/madleech/Button.git
	adafruit/Adafruit MLX90640@^1.1.1
	arkhipenko/TaskScheduler@^3.8.5
	ESP32Async/AsyncTCP
	ESP32Async/ESPAsyncWebServer
	https://github.com/ayam-brand-IOT/Wireless-Stick-Lite-V2.git#rev0.0.X

; ----------------------------------------------------------------------------
; Tests nativos (corren en la PC, sin hardware): unit tests de la lógica atómica
; de ConfigStore (.tmp -> validar -> .bak -> promover) con un FS mockeado en RAM.
; Correr con:  pio test -e native
; ----------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
; pio test no compila src/ por defecto: lo habilitamos pero filtrado a ConfigStore.cpp
; (el resto de src/ depende del core ESP32 y no compila nativo).
test_build_src = yes
build_src_filter = -<*> +<hardware/ConfigStore.cpp>
build_flags =
	-std=gnu++17
	-I src/hardware     ; para que el test encuentre ConfigStore.h
	-I test/mock        ; shims de Arduino/FS/SPIFFS/SD
	; Force-include del Logger mock: define LOGGER_H y neutraliza el Logger real.
	-include test/mock/Logger.h
lib_deps =
	bblanchon/ArduinoJson@^6.21.3
